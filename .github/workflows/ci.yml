name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test-rust:
    name: Rust — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: system_bank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/system_bank_test
      AMQP_URL: amqp://guest:guest@localhost:5672
      JWT_SECRET: test_secret_min_32_chars_for_ci_only

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('api-rust/Cargo.lock') }}

      - name: Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Instalar sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --quiet

      - name: Rodar migrations no banco de teste
        working-directory: api-rust
        run: sqlx migrate run --source ../migrations

      - name: Fmt check
        working-directory: api-rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: api-rust
        run: cargo clippy -- -D warnings

      - name: Auditoria de segurança
        working-directory: api-rust
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Testes com cobertura
        working-directory: api-rust
        run: cargo tarpaulin --all-features --fail-under 60

  build-cobol:
    name: COBOL — Compilação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar todos os programas
        run: docker run --rm -v ${{ github.workspace }}/batch-cobol:/app -w /app gnucobol/gnucobol:3.2 make all

      - name: Upload COBOL binaries
        uses: actions/upload-artifact@v4
        with:
          name: cobol-binaries
          path: batch-cobol/bin/

  test-cobol:
    name: COBOL — Testes
    runs-on: ubuntu-latest
    needs: build-cobol
    steps:
      - uses: actions/checkout@v4
      
      - name: Download COBOL binaries
        uses: actions/download-artifact@v4
        with:
          name: cobol-binaries
          path: batch-cobol/bin/
          
      - name: Executar testes COBOL
        run: |
          mkdir -p batch-cobol/io/input
          mkdir -p batch-cobol/io/output
          touch batch-cobol/io/input/rust_input.dat
          chmod +x batch-cobol/bin/*
          for bin in batch-cobol/bin/*; do
            echo "Testando $bin"
            docker run --rm -v ${{ github.workspace }}/batch-cobol:/app -w /app -e COB_LS_FIXED=Y gnucobol/gnucobol:3.2 ./bin/$(basename $bin)
          done

  docker-build:
    name: Docker — Build das imagens
    runs-on: ubuntu-latest
    needs: [lint-and-test-rust, test-cobol]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Rust
        uses: docker/build-push-action@v5
        with:
          context: api-rust/
          file: api-rust/Dockerfile
          push: false
          tags: system-bank-api:ci
          cache-from: type=gha,scope=api-rust
          cache-to: type=gha,mode=max,scope=api-rust

      - name: Build COBOL Worker
        uses: docker/build-push-action@v5
        with:
          context: batch-cobol/
          file: batch-cobol/Dockerfile
          push: false
          tags: system-bank-cobol:ci
          cache-from: type=gha,scope=batch-cobol
          cache-to: type=gha,mode=max,scope=batch-cobol
