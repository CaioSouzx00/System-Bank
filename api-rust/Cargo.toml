[package]
name = "system-bank-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["postgres", "uuid", "time", "rust_decimal"] }
rust_decimal = "1"
rust_decimal_macros = "1"
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
lapin = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
thiserror = "1"
anyhow = "1"
time = { version = "0.3", features = ["serde", "parsing", "macros", "formatting"] }
dotenv = "0.15"
dashmap = "5"
http-body-util = "0.1"
futures-util = "0.3"
opentelemetry = { version = "0.21" }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = { version = "0.13" }
tracing-opentelemetry = { version = "0.22" }
opentelemetry-http = "0.10"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = "0.23.43"
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
base64 = "0.23.1"
[dev-dependencies]
axum-test = "14"
tokio-test = "0.4"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"
